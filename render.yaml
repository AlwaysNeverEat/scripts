# Render Blueprint: backend базы рассчитанных машин (бесплатный план).
# Подключение: dashboard.render.com → New → Blueprint → выбрать этот репозиторий.
# После создания заполнить env-переменные в настройках сервиса (см. DEPLOY.md).

services:
  - type: web
    name: cars-db-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL   # Supabase → Connect → Session pooler URI
        sync: false
      - key: API_KEY        # придумать случайную строку, она же во всех клиентах
        sync: false
      - key: CORS_ORIGINS   # https://<username>.github.io
        sync: false
      - key: TELEGRAM_BOT_TOKEN   # @BotFather → /newbot; пусто = бот выключен
        sync: false
      - key: ADMIN_TELEGRAM_ID    # твой Telegram user id (узнать у @userinfobot)
        value: '691442300'
      - key: SUPABASE_URL         # Project Settings → API
        sync: false
      - key: SUPABASE_SERVICE_KEY # Project Settings → API → service_role (не anon!)
        sync: false
