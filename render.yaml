# Render Blueprint: backend базы рассчитанных машин (бесплатный план).
# Подключение: dashboard.render.com → New → Blueprint → выбрать этот репозиторий.
# После создания заполнить env-переменные в настройках сервиса (см. DEPLOY.md).

services:
  - type: web
    name: cars-db-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL   # Supabase → Connect → Session pooler URI
        sync: false
      - key: API_KEY        # придумать случайную строку, она же во всех клиентах
        sync: false
      - key: CORS_ORIGINS   # https://<username>.github.io
        sync: false
