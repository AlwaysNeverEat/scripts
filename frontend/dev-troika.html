<!DOCTYPE html>
<!-- Дев-песочница пасхалки «Тройка»: окно игры без входа.
     Открыть: npx vite → /dev-troika.html
     Сама игра целиком в браузере (на проде тоже — см. shared/troika.js), так
     что заглушка нужна только для мини-топа: по умолчанию он выдуманный.
     С ?api — ходит в настоящий /api/troika через прокси vite (нужен запущенный
     бэкенд, валидная сессия и накатанная миграция 026).
     В прод-сборку не попадает: vite собирает только index.html. -->
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>dev: тройка</title>
  <script>
    try {
      const t = localStorage.getItem('cars_db_theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      // и акцент — по той же причине и из того же места (см. src/accent.js)
      const acc = localStorage.getItem('cars_db_accent');
      if (acc !== null && isFinite(Number(acc))) {
        const deg = (x) => String(((Math.round(x) % 360) + 360) % 360);
        document.documentElement.style.setProperty('--accent-h', deg(Number(acc)));
        document.documentElement.style.setProperty('--accent-h-light', deg(Number(acc) - 21));
      }
    } catch {}
  </script>
</head>
<body>
  <div class="page-head">
    <h2 class="page-title">Тройка — песочница</h2>
    <p class="page-sub">Матч-3 8×8 на время: часы продлевают партию, каскады и «штучки» дают очки.</p>
  </div>
  <div class="page-body" style="display:flex; gap:8px; flex-wrap:wrap">
    <button class="btn btn-pri" id="dev-open">Открыть игру</button>
  </div>

  <script type="module">
    import './src/style.css';
    import { initTheme } from './src/theme.js';
    import { openTroika } from './src/troika.js';

    initTheme();
    const USER = { id: 'dev-user', display_name: 'Я' };

    // Выдуманный мини-топ: проверять на нём нужно вёрстку строк и подсветку
    // своей, а не работу базы.
    const rows = [
      { rank: 1, id: 'u1', display_name: 'Костя', avatar: null, role_prefix: null, score: 24800, level: 10, clocks: 41, cascade: 7, games: 9 },
      { rank: 2, id: 'dev-user', display_name: 'Я', avatar: null, role_prefix: null, score: 12400, level: 5, clocks: 22, cascade: 5, games: 4 },
      { rank: 3, id: 'u3', display_name: 'Оля', avatar: null, role_prefix: null, score: 9300, level: 4, clocks: 17, cascade: 4, games: 2 },
    ];
    let me = { rank: 2, score: 12400, level: 5, clocks: 22, cascade: 5, games: 4 };

    async function stubFetch(path, { body } = {}) {
      if (path === '/api/troika/top') return { rows, me };
      if (path === '/api/troika/score') {
        const improved = body.score > me.score;
        if (improved) { me = { ...me, score: body.score, clocks: body.clocks, cascade: body.cascade, games: me.games + 1 }; }
        const mine = rows.find(r => r.id === USER.id);
        if (mine && improved) mine.score = body.score;
        rows.sort((a, b) => b.score - a.score).forEach((r, i) => { r.rank = i + 1; });
        console.log('dev: результат партии', body, improved ? '— рекорд' : '');
        return { ok: true, best: me.score, games: me.games, improved, rows, me };
      }
      throw new Error('dev: неизвестный путь ' + path);
    }

    const realFetch = async (path, { method = 'GET', body } = {}) => {
      const res = await fetch(path, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      return res.json();
    };
    const apiFetch = location.search.includes('api') ? realFetch : stubFetch;

    document.getElementById('dev-open').onclick = () => openTroika({ apiFetch, user: USER });
  </script>
</body>
</html>
