<!DOCTYPE html>
<!-- Дев-песочница пасхалки «Рогалик»: окно игры без входа.
     Открыть: npx vite → /dev-roguelike.html
     Забег целиком считается в браузере (на проде тоже — см. shared/roguelike.js),
     так что заглушка нужна только для мини-топа: по умолчанию он выдуманный.
     С ?api — ходит в настоящий /api/roguelike через прокси vite (нужен
     запущенный бэкенд, валидная сессия и накатанная миграция 034).
     В прод-сборку не попадает: vite собирает только index.html. -->
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>dev: рогалик</title>
  <script>
    try {
      const t = localStorage.getItem('cars_db_theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      // и акцент — по той же причине и из того же места (см. src/accent.js)
      const acc = localStorage.getItem('cars_db_accent');
      if (acc !== null && isFinite(Number(acc))) {
        const deg = (x) => String(((Math.round(x) % 360) + 360) % 360);
        document.documentElement.style.setProperty('--accent-h', deg(Number(acc)));
        document.documentElement.style.setProperty('--accent-h-light', deg(Number(acc) - 21));
      }
    } catch {}
  </script>
</head>
<body>
  <div class="page-head">
    <h2 class="page-title">Рогалик — песочница</h2>
    <p class="page-sub">Карточный забег: карта узлов, бой по видимому намерению, лут, апгрейды и мутации, бесконечные циклы.</p>
  </div>
  <div class="page-body" style="display:flex; gap:8px; flex-wrap:wrap">
    <button class="btn btn-pri" id="dev-open">Открыть игру</button>
    <button class="btn btn-sec" id="dev-drop">Забыть сохранённый забег</button>
    <button class="btn btn-sec" id="dev-rich">Выдать 5 камней и 3 осколка</button>
  </div>

  <script type="module">
    import './src/style.css';
    import { initTheme } from './src/theme.js';
    import { openRoguelike } from './src/roguelike.js';

    initTheme();
    const USER = { id: 'dev-user', display_name: 'Я' };

    // Выдуманный мини-топ: проверять на нём нужно вёрстку строк и подсветку
    // своей, а не работу базы.
    const rows = [
      { rank: 1, id: 'u1', display_name: 'Костя', avatar: null, role_prefix: null, loops: 5, floor: 68, kills: 31, elites: 6, bosses: 5, cards: 34, level: 9, mutations: 4, runs: 12 },
      { rank: 2, id: 'dev-user', display_name: 'Я', avatar: null, role_prefix: null, loops: 2, floor: 29, kills: 14, elites: 2, bosses: 2, cards: 21, level: 5, mutations: 1, runs: 5 },
      { rank: 3, id: 'u3', display_name: 'Оля', avatar: null, role_prefix: null, loops: 1, floor: 17, kills: 9, elites: 1, bosses: 1, cards: 18, level: 4, mutations: 0, runs: 3 },
    ];
    let me = { rank: 2, loops: 2, floor: 29, kills: 14, elites: 2, bosses: 2, cards: 21, level: 5, mutations: 1, runs: 5 };

    async function stubFetch(path, { body } = {}) {
      if (path === '/api/roguelike/top') return { rows, me };
      if (path === '/api/roguelike/run') {
        const improved = body.loops > me.loops || (body.loops === me.loops && body.floor > me.floor);
        if (improved) me = { ...me, ...body, rank: me.rank, runs: me.runs + 1 };
        const mine = rows.find(r => r.id === USER.id);
        if (mine && improved) Object.assign(mine, body);
        rows.sort((a, b) => b.loops - a.loops || b.floor - a.floor).forEach((r, i) => { r.rank = i + 1; });
        console.log('dev: забег', body, improved ? '— рекорд' : '');
        return { ok: true, best: { loops: me.loops, floor: me.floor }, runs: me.runs, improved, rows, me };
      }
      throw new Error('dev: неизвестный путь ' + path);
    }

    const realFetch = async (path, { method = 'GET', body } = {}) => {
      const res = await fetch(path, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      return res.json();
    };
    const apiFetch = location.search.includes('api') ? realFetch : stubFetch;

    document.getElementById('dev-open').onclick = () => openRoguelike({ apiFetch, user: USER });
    document.getElementById('dev-drop').onclick = () => {
      localStorage.removeItem('cars_db_roguelike:' + USER.id);
      console.log('dev: сохранённый забег забыт');
    };
    // Быстрая проверка экранов апгрейда и мутаций: копить камни забегом долго.
    document.getElementById('dev-rich').onclick = () => {
      const key = 'cars_db_roguelike:' + USER.id;
      const raw = localStorage.getItem(key);
      if (!raw) { console.warn('dev: сначала начните забег и закройте окно'); return; }
      const run = JSON.parse(raw);
      run.stones += 5; run.shards += 3;
      localStorage.setItem(key, JSON.stringify(run));
      console.log('dev: выдано');
    };
  </script>
</body>
</html>
