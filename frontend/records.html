<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <title>Записи — SPOT</title>
  <meta name="robots" content="noindex"/>
  <!-- Записи переехали внутрь основного приложения (роут #/records), чтобы
       переключение с калькулятором было мгновенным. Этот файл остался ради
       старых ссылок и закладок: уводит на новый адрес без «records.html». -->
  <script>
    (function () {
      var base = location.pathname.replace(/records\.html$/, '');
      location.replace(base + (location.search || '') + '#/records');
    })();
  </script>
</head>
<body>
  <noscript><a href="./#/records">Открыть записи</a></noscript>
</body>
</html>
