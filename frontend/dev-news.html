<!DOCTYPE html>
<!-- Дев-песочница вкладки «Что нового?»: лента постов без бэкенда и без входа.
     Открыть: npx vite → /dev-news.html
     Кнопки внизу гоняют состояние «прочитано / не прочитано» и счётчик вкладки.
     В прод-сборку не попадает: vite собирает только index.html. -->
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>dev: что нового</title>
  <script>
    // как в index.html: тема ставится до первого кадра
    try {
      const t = localStorage.getItem('cars_db_theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      // и акцент — по той же причине и из того же места (см. src/accent.js)
      const acc = localStorage.getItem('cars_db_accent');
      if (acc !== null && isFinite(Number(acc))) {
        const deg = (x) => String(((Math.round(x) % 360) + 360) % 360);
        document.documentElement.style.setProperty('--accent-h', deg(Number(acc)));
        document.documentElement.style.setProperty('--accent-h-light', deg(Number(acc) - 21));
      }
    } catch {}
  </script>
</head>
<body>
  <nav id="app-tabs" class="app-tabs" aria-label="Разделы">
    <div class="app-tabs-inner">
      <div class="app-tabs-row" role="tablist">
        <button class="app-tab" role="tab">
          <span class="app-tab-label">Калькулятор</span>
        </button>
        <button class="app-tab active" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v12a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2V6Z"/><path d="M17 8h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2"/><line x1="8" y1="8" x2="13" y2="8"/><line x1="8" y1="12" x2="13" y2="12"/><line x1="8" y1="16" x2="11" y2="16"/></svg>
          <span class="app-tab-label">Что нового?</span>
          <span class="app-tab-badge hidden" id="news-badge" aria-hidden="true"></span>
        </button>
      </div>
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Светлая тема" title="Светлая тема">
        <svg class="theme-icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M6 18l-1.4 1.4M19.4 4.6 18 6"/></svg>
        <svg class="theme-icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </nav>

  <div id="page-news">
    <div class="page-head">
      <h2 class="page-title">Что нового?</h2>
      <p class="page-sub">Коротко о том, что изменилось на сайте.</p>
    </div>
    <div id="news-body" class="page-body news-body"></div>
    <div class="page-body" style="display:flex; gap:8px; flex-wrap:wrap">
      <button class="btn btn-sec" id="dev-unread">Сделать непрочитанным</button>
      <button class="btn btn-sec" id="dev-read">Отметить прочитанным</button>
    </div>
  </div>

  <script type="module">
    import './src/style.css';
    import { initTheme } from './src/theme.js';
    import { initNewsFeed, markNewsSeen, unseenNewsCount } from './src/newsFeed.js';

    initTheme();

    const badge = document.getElementById('news-badge');
    function refresh() {
      initNewsFeed();
      const n = unseenNewsCount();
      badge.textContent = n ? String(n) : '';
      badge.classList.toggle('hidden', !n);
    }

    document.getElementById('dev-unread').onclick = () => {
      localStorage.removeItem('news_seen_post_ids');
      refresh();
    };
    document.getElementById('dev-read').onclick = () => {
      markNewsSeen();
      refresh();
    };

    refresh();
  </script>
</body>
</html>
