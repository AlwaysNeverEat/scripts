<!DOCTYPE html>
<!-- Дев-песочница порядка станций в обзоре: доска из настоящих адресов
     справочника, чтобы у карточек были линии метро и цвета столбиков.
     Открыть: npx vite → /dev-records-sort.html
     В прод-сборку не попадает: vite собирает только index.html. -->
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>dev: порядок станций</title>
</head>
<body>
  <div id="page-records"></div>
  <script type="module">
    const TODAY = '26.07.2026';
    const TOMORROW = '27.07.2026';

    const slots = [];
    for (let h = 9; h <= 21; h++) { slots.push(`${String(h).padStart(2, '0')}:00`); slots.push(`${String(h).padStart(2, '0')}:30`); }

    // Заголовки колонок ровно в том виде, в каком их отдаёт /admin/record:
    // так они матчатся со справочником и у станций появляется линия метро.
    const titles = [
      'Санкт-Петербург, Выборгское ш. 212к8', 'Санкт-Петербург, Полюстровский пр. 59к1',
      'Санкт-Петербург, ул. Руставели 69', 'Мурино, Охтинская аллея 9/1',
      'Санкт-Петербург, Кубинская 82к3', 'Санкт-Петербург, ул. Казакова 29',
      'Санкт-Петербург, пр. Ветеранов 167к8', 'Санкт-Петербург, Маршала Жукова 21',
      'Санкт-Петербург, Придорожная аллея 16Ж', 'Санкт-Петербург, Выборгское шоссе 2',
      'Санкт-Петербург, Кузнецовская 60', 'Санкт-Петербург, Типанова 20к1',
      'Санкт-Петербург, Малая балканская 35', 'Санкт-Петербург, Уральская 7',
      'Санкт-Петербург, Караваевская 15а', 'Санкт-Петербург, Советский 55к2',
      'Санкт-Петербург, Индустриальный 47к1Б', 'Санкт-Петербург, Дальневосточный 3а',
      'Санкт-Петербург, Солидарности 22А', 'Кудрово, Центральная ул., 25',
      'Санкт-Петербург, Планерная 16', 'Санкт-Петербург, ул. Оптиков 2',
      'Санкт-Петербург, Фучика 23А', 'Санкт-Петербург, Фучика 14к4',
      'Санкт-Петербург, Новая станция без справочника 1',
    ];

    const makeBoard = (date, seed) => {
      const addresses = titles.map((title, i) => ({ id: String(i + 1), title }));
      const cells = {};
      addresses.forEach((a, i) => {
        cells[a.id] = {};
        slots.forEach((t, j) => {
          if (j < 4) return; // раннее утро закрыто
          const busy = (i * 7 + j * 3 + seed) % 5;
          const records = busy === 0 ? [] : [{
            id: `${date}-${a.id}-${t}`, addressId: a.id, timeStart: t,
            timeEnd: t, name: `Клиент ${busy}`, phone: '+7 (921) 000-00-00',
            phoneDigits: '79210000000', isStub: false, status: '', customer: `Клиент ${busy}`, deleteUrl: '',
          }];
          cells[a.id][t] = { records, free: 2 - records.length };
        });
      });
      return { date, timeSlots: slots, addresses, cells };
    };

    const boards = { [TODAY]: makeBoard(TODAY, 0), [TOMORROW]: makeBoard(TOMORROW, 2) };

    const realFetch = window.fetch;
    window.fetch = async (url, init) => {
      const u = String(url);
      const json = (data) => new Response(JSON.stringify(data), { headers: { 'Content-Type': 'application/json' } });
      if (u.includes('/api/auth/me')) return json({ user: null });
      if (u.includes('/api/records/status')) return json({ credentials: true, alive: true, today: TODAY, tomorrow: TOMORROW, queue: {} });
      if (u.includes('/api/records/board')) {
        const date = new URL(u, location.origin).searchParams.get('date') || TODAY;
        const board = boards[date] || makeBoard(date, date.length);
        return json({ date, board, fetchedAt: new Date().toISOString(), ok: true, error: '', ops: [] });
      }
      if (u.includes('/api/records/ops')) return json({ ops: [] });
      if (u.includes('/api/records/record/')) return json({ record: { id: u.split('/').pop(), name: '', phone: '', carNumber: '', comment: '' } });
      return realFetch(url, init);
    };

    const { startRecords } = await import('/src/records/records.js');
    startRecords(document.getElementById('page-records'));
  </script>
</body>
</html>
