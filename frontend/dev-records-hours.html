<!DOCTYPE html>
<!-- Дев-песочница раздела «Записи»: вся сеть станций и полный день оригинала
     (09:00–22:30) без бэкенда. Здесь видно то, чего нет в других песочницах:
     сетка станции с дорожками-боксами и кнопками «записать», список станций
     сбоку и конец рабочего дня — записывать можно до 20:30, а слоты после
     21:00 помечены «не работаем» (чужая запись в 21:30 при этом видна).
     Открыть: npx vite → /dev-records-hours.html
     В прод-сборку не попадает: vite собирает только index.html и records.html. -->
<html lang="ru">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>dev: записи — рабочий день</title></head>
<body>
  <div id="page-records"></div>
  <script type="module">
    const TODAY = '28.07.2026';
    const slots = [];
    for (let h = 9; h <= 22; h++) { slots.push(`${String(h).padStart(2,'0')}:00`); slots.push(`${String(h).padStart(2,'0')}:30`); }

    const titles = [
      'Санкт-Петербург, Полюстровский проспект, 59к1',
      'Выборгское ш. 212к8', 'СПб, Оптиков 2', 'Фучика 14к4', 'СПб, Фучика 23А',
      'Придорожная ал 16Ж, 4 бокс', 'Кубинская 82к3', 'Типанова 20к1', 'СПб, Малая балканская 35',
      'Рыбацкое, Караваевская 15а', 'Санкт-Петербург, Металлострой, Советский 55к2', 'Дальневосточный 3а',
      'Санкт-Петербург, Индустриальный проспект, 47к1Б', 'СПб, Солидарности 22А',
      'Центральная ул., 25, Кудрово, Ленинградская обл., 188689', 'Охтинская ал 9/1,Мурино',
      'Кузнецовская 60', 'СПб, Казакова 29', 'СПб, Руставели 69', 'СПБ, Ветеранов 167 к.8 СПОТ',
      'Уральская 7', 'Планерная 16', 'СПб, Маршала Жукова 21, АЦ Маршал, Бокс 6', 'СПб, Выборгское шоссе 2',
    ];
    const addresses = titles.map((t, i) => ({ id: String(i + 1), title: t }));

    const rec = (id, aid, t0, t1, name, phone, isStub = false, status = '') => ({
      id, addressId: aid, timeStart: t0, timeEnd: t1, name, phone,
      phoneDigits: phone.replace(/\D/g, ''), isStub, status, customer: name, deleteUrl: '/admin/record/delete?id=' + id,
    });

    const main = [
      rec(1, '1', '09:00', '09:30', 'Савин Юрий Ильич', '+7(900) 624-98-08', false, 'checked'),
      rec(2, '1', '10:30', '11:00', 'Павел', '+7(965) 046-86-48', false, 'checked'),
      rec(3, '1', '11:30', '12:00', 'Тимур двс', '+7(981) 933-52-32', false, 'checked'),
      rec(4, '1', '12:00', '12:30', 'Тимур двс', '+71111111111', true, 'checked'),
      rec(5, '1', '12:30', '13:00', 'Дмитрий', '+7(981) 850-26-35', false, 'checked'),
      rec(6, '1', '18:30', '19:00', 'Алексеенко Алексей Сергеевич', '+7(911) 111-22-33', false, 'new'),
      rec(7, '1', '21:30', '22:00', 'Поздняя запись из админки', '+7(911) 000-00-00', false, 'new'),
    ];

    const cells = {};
    for (const a of addresses) {
      cells[a.id] = {};
      const boxes = a.id === '1' ? 1 : (Number(a.id) % 3 === 0 ? 2 : 1);
      for (const t of slots) {
        if (a.id === '1' && ['09:30','10:00','11:00','13:00','13:30','14:00','14:30','15:00'].includes(t)) continue; // закрыто
        const inSlot = main.filter(r => r.addressId === a.id && r.timeStart === t);
        const busy = a.id === '1' ? inSlot.length : (Number(a.id) * slots.indexOf(t)) % 4 === 0 ? 1 : 0;
        cells[a.id][t] = { records: inSlot, free: Math.max(0, boxes - Math.max(inSlot.length, busy)) };
      }
    }

    const board = { date: TODAY, timeSlots: slots, addresses, cells };
    const ops = [];
    const realFetch = window.fetch;
    window.fetch = async (url, init) => {
      const u = String(url);
      const json = (d) => new Response(JSON.stringify(d), { headers: { 'Content-Type': 'application/json' } });
      if (u.includes('/api/records/status')) return json({ credentials: true, alive: true, today: TODAY, tomorrow: '29.07.2026', queue: {} });
      if (u.includes('/api/records/board')) return json({ date: TODAY, board, fetchedAt: new Date().toISOString(), ok: true, error: '', ops });
      if (u.includes('/api/records/ops')) return json({ ops });
      if (u.includes('/api/auth/me')) return json({ user: null });
      if (u.includes('/api/records/record/')) return json({ record: { id: '1', name: '', phone: '', carNumber: 'о123ор198', comment: 'тест' } });
      return realFetch(url, init);
    };

    const { startRecords } = await import('/src/records/records.js');
    startRecords(document.getElementById('page-records'));
  </script>
</body>
</html>
