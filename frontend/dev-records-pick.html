<!DOCTYPE html>
<!-- Дев-песочница выбора времени: фейковая доска, без бэкенда.
     Открыть: npx vite → /dev-records-pick.html?modal=create (или ?modal=extend,
     ?focus=<id записи>[&time=HH:MM] — переход по ссылке из профиля;
     несуществующий id с пустым временем показывает «записи больше нет»)
     В прод-сборку не попадает: vite собирает только index.html. -->
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>dev: выбор времени</title>
</head>
<body>
  <div id="page-records"></div>
  <script type="module">
    const TODAY = '26.07.2026';
    const slots = [];
    for (let h = 9; h <= 22; h++) { slots.push(`${String(h).padStart(2, '0')}:00`); slots.push(`${String(h).padStart(2, '0')}:30`); }

    const rec = (id, timeStart, timeEnd, name, phone, isStub = false, status = '') => ({
      id, addressId: '1', timeStart, timeEnd, name, phone,
      phoneDigits: phone.replace(/\D/g, ''), isStub, status, customer: name,
      deleteUrl: `/admin/record/delete?id=${id}&time=${TODAY}+${timeStart}&address_id=1`,
    });

    const records = [
      rec(1, '12:00', '12:30', 'Илья', '+7 (915) 565-85-94'),
      rec(2, '13:00', '13:30', 'Новак Михаил Викторович', '+7 (921) 846-17-52', false, 'new'),
      rec(3, '13:30', '14:00', 'Новак Михаил Викторович', '+7 (000) 000-00-00', true), // продление
      rec(4, '14:00', '14:30', 'Серченя Алексей', '+7 (921) 872-45-63', false, 'checked'),
      rec(5, '14:30', '15:00', 'Пётр Иванов', '+7 (911) 111-22-33', false, 'late'),
      rec(6, '15:00', '15:30', 'Пётр Иванов', '+7 (000) 000-00-00', true),
      rec(7, '17:00', '17:30', 'Анна', '+7 (921) 000-11-22'),
    ];

    const cells = { 1: {} };
    for (const t of slots) {
      if (t < '11:00') continue; // до 11:00 — закрыто
      const inSlot = records.filter(r => r.timeStart === t);
      cells[1][t] = { records: inSlot, free: 2 - inSlot.length };
    }
    // один слот забит обоими боксами — строка «занято»
    cells[1]['16:00'] = { records: [rec(8, '16:00', '16:30', 'Оба бокса', '+7 (900) 000-00-00'), rec(9, '16:00', '16:30', 'Второй бокс', '+7 (900) 000-00-01')], free: 0 };

    // Вторая станция — полностью свободный день: на ней проверяется «весь день»
    cells[2] = {};
    for (const t of slots) cells[2][t] = { records: [], free: 1 };

    const board = {
      date: TODAY, timeSlots: slots,
      // Заголовки — ровно как в админке: по ним findStationMeta достаёт
      // справочник (чипы, код перевода звонка, плашку на карте). С выдуманными
      // адресами станция открывалась вообще без метаданных, и песочница врала.
      addresses: [
        // Фучика 14к4 — самый тяжёлый случай для карты: соседняя станция
        // (Фучика 23А) в 112 метрах строго на юг, и подписи расходятся только
        // на сильном зуме. Пусть песочница открывается сразу на нём.
        { id: '1', title: 'Санкт-Петербург, Фучика 14к4' },         // 2 бокса
        { id: '2', title: 'Санкт-Петербург, Руставели 69' },        // 2 бокса
      ],
      cells,
    };

    const ops = [{
      id: 7, type: 'create', status: 'pending', lastError: '',
      payload: { addressId: '1', date: TODAY, time: '18:00', name: 'Из очереди', durationMinutes: 30 },
    }];

    // ?me=<логин> — под кем «залогинены»: от этого зависит подпись оператора
    // в строке для Битрикса. Без параметра — гость (как без аккаунта сайта).
    const me = new URLSearchParams(location.search).get('me');

    const realFetch = window.fetch;
    window.fetch = async (url, init) => {
      const u = String(url);
      const json = (data) => new Response(JSON.stringify(data), { headers: { 'Content-Type': 'application/json' } });
      if (u.includes('/api/auth/me')) {
        return me
          ? json({ user: { id: 1, login: me, display_name: me } })
          : new Response(JSON.stringify({ error: 'unauthorized' }), { status: 401, headers: { 'Content-Type': 'application/json' } });
      }
      if (u.includes('/api/records/status')) return json({ credentials: true, alive: true, today: TODAY, tomorrow: '27.07.2026', queue: {} });
      if (u.includes('/api/records/board')) return json({ date: TODAY, board, fetchedAt: new Date().toISOString(), ok: true, error: '', ops });
      if (u.includes('/api/records/ops')) return json({ ops });
      if (u.includes('/api/records/record/')) return json({ record: { id: u.split('/').pop(), name: '', phone: '',
        carNumber: 'о123ор198', comment: 'Замена масла + масляный фильтр, клиент просил позвонить перед приездом' } });
      return realFetch(url, init);
    };

    const { startRecords, focusRecords } = await import('/src/records/records.js');
    startRecords(document.getElementById('page-records'));

    // ?focus=<id записи> — то же, что переход по ссылке из профиля (карточка
    // сделанной записи): раздел обязан сам дождаться доски, открыть станцию и
    // показать эту запись. Дата тут в ISO — ровно как в ссылке.
    const focus = new URLSearchParams(location.search).get('focus');
    if (focus) focusRecords({ date: '2026-07-26', stationId: '1', time: new URLSearchParams(location.search).get('time') || '13:00', recordId: focus });

    // ?modal=create|extend — сразу открыть нужное окно (для скриншотов и правки стилей)
    const want = new URLSearchParams(location.search).get('modal');
    if (want) {
      const click = (sel) => new Promise((done) => {
        const tick = () => {
          const el = document.querySelector(sel);
          if (el) { el.click(); requestAnimationFrame(() => done()); }
          else setTimeout(tick, 60);
        };
        tick();
      });
      await click('.rc-card');
      if (want === 'create') await click('[data-action="create-at"]');
      if (want === 'extend') { await click('[data-action="open-chain"]'); await click('[data-action="open-extend"]'); }
    }
  </script>
</body>
</html>
