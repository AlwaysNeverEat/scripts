<!DOCTYPE html>
<!-- Дев-песочница прав модератора: правка карточки станции, предупреждения и
     скрытая от обычных глаз кнопка логина/пароля админки.
     Открыть: npx vite → /dev-records-mod.html (модератор)
                        /dev-records-mod.html?role=user (обычный работник)
                        /dev-records-mod.html?creds=0 (кредов ещё нет — гейт)
     Правки хранятся в памяти вкладки: перезагрузка возвращает исходные.
     В прод-сборку не попадает: vite собирает только index.html. -->
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>dev: права модератора</title>
</head>
<body>
  <div id="page-records"></div>
  <script type="module">
    const TODAY = '26.07.2026';
    const TOMORROW = '27.07.2026';
    const params = new URLSearchParams(location.search);
    const ROLE = params.get('role') || 'mod';
    const HAS_CREDS = params.get('creds') !== '0';

    const slots = [];
    for (let h = 9; h <= 21; h++) { slots.push(`${String(h).padStart(2, '0')}:00`); slots.push(`${String(h).padStart(2, '0')}:30`); }

    const titles = [
      'Санкт-Петербург, ул. Оптиков 2', 'Санкт-Петербург, Планерная 16',
      'Санкт-Петербург, Фучика 23А', 'Санкт-Петербург, Фучика 14к4',
      'Санкт-Петербург, ул. Казакова 29', 'Санкт-Петербург, Кубинская 82к3',
      'Санкт-Петербург, Уральская 7', 'Санкт-Петербург, Советский 55к2',
      'Санкт-Петербург, Дальневосточный 3а', 'Санкт-Петербург, Кузнецовская 60',
    ];

    const makeBoard = (date, seed) => {
      const addresses = titles.map((title, i) => ({ id: String(i + 1), title }));
      const cells = {};
      addresses.forEach((a, i) => {
        cells[a.id] = {};
        slots.forEach((t, j) => {
          if (j < 4) return;
          const busy = (i * 7 + j * 3 + seed) % 5;
          const records = busy === 0 ? [] : [{
            id: `${date}-${a.id}-${t}`, addressId: a.id, timeStart: t,
            timeEnd: t, name: `Клиент ${busy}`, phone: '+7 (921) 000-00-00',
            phoneDigits: '79210000000', isStub: false, status: '', customer: `Клиент ${busy}`, deleteUrl: '',
          }];
          cells[a.id][t] = { records, free: 2 - records.length };
        });
      });
      return { date, timeSlots: slots, addresses, cells };
    };

    const boards = { [TODAY]: makeBoard(TODAY, 0), [TOMORROW]: makeBoard(TOMORROW, 2) };

    // Правки станций — как в БД, только в памяти вкладки.
    const stations = {
      'Оптиков 2': {
        patch: {}, warning: 'Заправка кондея не работает',
        updatedAt: new Date().toISOString(), updatedBy: 'Дежурный',
      },
    };

    const realFetch = window.fetch;
    window.fetch = async (url, init) => {
      const u = String(url);
      const method = (init?.method || 'GET').toUpperCase();
      const json = (data, status = 200) => new Response(JSON.stringify(data), {
        status, headers: { 'Content-Type': 'application/json' },
      });
      if (u.includes('/api/auth/me')) {
        return json({ user: { id: 'u1', display_name: 'Тестовый', login: 'test', role: ROLE } });
      }
      if (u.includes('/api/records/status')) return json({ credentials: HAS_CREDS, alive: true, today: TODAY, tomorrow: TOMORROW, queue: {} });
      if (u.includes('/api/records/stations')) {
        if (method === 'PUT') {
          if (ROLE !== 'mod' && ROLE !== 'admin') return json({ error: 'forbidden' }, 403);
          const body = JSON.parse(init.body);
          const key = body.key;
          const patch = body.patch || {};
          const warning = body.warning || '';
          if (!Object.keys(patch).length && !warning) {
            delete stations[key];
            return json({ ok: true, station: null });
          }
          stations[key] = { patch, warning, updatedAt: new Date().toISOString(), updatedBy: 'Тестовый' };
          return json({ ok: true, station: stations[key] });
        }
        return json({ stations });
      }
      if (u.includes('/api/records/board')) {
        if (!HAS_CREDS) return json({ error: { code: 'zms_credentials_required', message: 'нужны креды' } }, 403);
        const date = new URL(u, location.origin).searchParams.get('date') || TODAY;
        const board = boards[date] || makeBoard(date, date.length);
        return json({ date, board, fetchedAt: new Date().toISOString(), ok: true, error: '', ops: [] });
      }
      if (u.includes('/api/records/ops')) return json({ ops: [] });
      if (u.includes('/api/records/record/')) return json({ record: { id: u.split('/').pop(), name: '', phone: '', carNumber: '', comment: '' } });
      return realFetch(url, init);
    };

    const { startRecords } = await import('/src/records/records.js');
    startRecords(document.getElementById('page-records'));
  </script>
</body>
</html>
