<!DOCTYPE html>
<!-- Дев-песочница названия станции под шейдером (см. src/records/titleWarp.js).
     Открыть: npx vite → /dev-warp.html
     На живом сайте этого не посмотреть — раздел «Записи» за входом и за базой.
     В прод-сборку не попадает: vite собирает только index.html. -->
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>dev: название станции</title>
  <style>
    body { padding: 24px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .note { color: var(--sub); font-size: 13px; max-width: 60ch; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="row">
    <button class="btn btn-sec" id="theme">Сменить тему</button>
    <button class="btn btn-sec" id="again">Перерисовать шапку</button>
  </div>
  <p class="note">
    Название ведёт шейдер, код перевода звонка — нет. Кнопка «Перерисовать»
    выбрасывает узел заголовка и собирает его заново — так делает доска раз в
    45 секунд: искажение при этом обязано продолжиться с того же места, а не
    начаться с нуля.
  </p>
  <div id="host"></div>
  <script type="module">
    import '/src/style.css';
    import '/src/records/records.css';
    import { applyTheme, currentTheme } from '/src/theme.js';
    import { initTitleWarp } from '/src/records/titleWarp.js';

    const NAMES = ['Охтинская 9/1, Мурино', 'Жукова 21', 'Выб. шоссе 212к8'];
    const host = document.getElementById('host');

    const draw = () => {
      // Обёртка .rc-station — не декорация: на ней живёт --row-h-ref, которым
      // задан кегль названия (шапка и расписание — один масштаб).
      host.innerHTML = NAMES.map((name, i) => `
        <div class="rc-station"><div class="rc-station-head">
            <div class="rc-station-headline">
                <h1 class="rc-station-title">
                    <span class="rc-station-name"><span class="rc-warp-src">${name}</span></span>
                    <span class="rc-station-code">##${10 + i}</span>
                </h1>
            </div>
        </div></div>`).join('');
      // initTitleWarp поднимает эффект на ПЕРВОМ заголовке — на странице сайта
      // открытая станция всегда одна, и второй контекст WebGL тут не нужен.
      initTitleWarp();
    };

    document.getElementById('theme').onclick = () => applyTheme(currentTheme() === 'light' ? 'dark' : 'light');
    document.getElementById('again').onclick = draw;
    draw();
  </script>
</body>
</html>
