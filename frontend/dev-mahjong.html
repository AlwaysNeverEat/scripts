<!DOCTYPE html>
<!-- Дев-песочница пасхалки «Маджонг»: окно игры без входа.
     Открыть: npx vite → /dev-mahjong.html
     Сама игра целиком в браузере (на проде тоже — см. shared/mahjong.js), так
     что заглушка нужна только для мини-топа: по умолчанию он выдуманный.
     С ?api — ходит в настоящий /api/mahjong через прокси vite (нужен
     запущенный бэкенд, валидная сессия и накатанная миграция 037).
     В прод-сборку не попадает: vite собирает только index.html. -->
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>dev: маджонг</title>
  <script>
    try {
      const t = localStorage.getItem('cars_db_theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      // и акцент — по той же причине и из того же места (см. src/accent.js)
      const acc = localStorage.getItem('cars_db_accent');
      if (acc !== null && isFinite(Number(acc))) {
        const deg = (x) => String(((Math.round(x) % 360) + 360) % 360);
        document.documentElement.style.setProperty('--accent-h', deg(Number(acc)));
        document.documentElement.style.setProperty('--accent-h-light', deg(Number(acc) - 21));
      }
    } catch {}
  </script>
</head>
<body>
  <div class="page-head">
    <h2 class="page-title">Маджонг — песочница</h2>
    <p class="page-sub">Классическая «черепаха» из 144 фишек. Мини-топ — по времени партии.</p>
  </div>
  <div class="page-body" style="display:flex; gap:8px; flex-wrap:wrap">
    <button class="btn btn-pri" id="dev-open">Открыть игру</button>
  </div>

  <script type="module">
    import './src/style.css';
    import { initTheme } from './src/theme.js';
    import { openMahjong } from './src/mahjong.js';

    initTheme();
    const USER = { id: 'dev-user', display_name: 'Я' };

    // Выдуманный мини-топ: проверять на нём нужно вёрстку строк, подсветку
    // своей и переход в профиль по клику, а не работу базы.
    const rows = [
      { rank: 1, id: 'u1', display_name: 'Костя', avatar: null, role_prefix: null, seconds: 402, shuffles: 0, wins: 9 },
      { rank: 2, id: 'dev-user', display_name: 'Я', avatar: null, role_prefix: null, seconds: 588, shuffles: 1, wins: 3 },
      { rank: 3, id: 'u3', display_name: 'Оля', avatar: null, role_prefix: null, seconds: 731, shuffles: 2, wins: 5 },
    ];
    let me = { rank: 2, seconds: 588, shuffles: 1, wins: 3 };

    async function stubFetch(path, { body } = {}) {
      if (path === '/api/mahjong/top') return { rows, me };
      if (path === '/api/mahjong/score') {
        // Рекорд здесь — МЕНЬШЕЕ время, как в пасьянсе; в заглушке тоже.
        const improved = body.seconds < me.seconds;
        if (improved) me = { ...me, seconds: body.seconds, shuffles: body.shuffles, wins: me.wins + 1 };
        const mine = rows.find(r => r.id === USER.id);
        if (mine && improved) mine.seconds = body.seconds;
        rows.sort((a, b) => a.seconds - b.seconds).forEach((r, i) => { r.rank = i + 1; });
        console.log('dev: стол разобран', body, improved ? '— рекорд' : '');
        return { ok: true, best: me.seconds, wins: me.wins, improved, rows, me };
      }
      throw new Error('dev: неизвестный путь ' + path);
    }

    const realFetch = async (path, { method = 'GET', body } = {}) => {
      const res = await fetch(path, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      return res.json();
    };
    const apiFetch = location.search.includes('api') ? realFetch : stubFetch;

    document.getElementById('dev-open').onclick = () => openMahjong({ apiFetch, user: USER });
  </script>
</body>
</html>
