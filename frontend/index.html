<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Калькулятор замены масла</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fugaz+One&family=Russo+One&family=Unbounded:wght@200..900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/src/style.css"/>
</head>
<body>
  <!-- Boot screen: показывается, пока сервер на Render просыпается (src/bootScreen.js) -->
  <div id="boot-screen">
    <div class="boot-card">
      <div class="boot-head">
        <span class="boot-title">SYS/BOOT</span>
        <span class="boot-time" id="boot-time"></span>
      </div>
      <div class="boot-log" id="boot-log"></div>
      <div class="boot-bar">
        <div class="boot-bar-fill" id="boot-bar-fill">
          <div class="boot-bar-wave"></div>
          <div class="boot-bar-shimmer"></div>
        </div>
      </div>
      <div class="boot-foot">
        <span class="boot-status" id="boot-status">LOADING — 0%</span>
        <div class="boot-actions hidden" id="boot-actions">
          <button id="boot-retry" class="boot-btn">Retry</button>
          <button id="boot-skip" class="boot-btn">Continue</button>
        </div>
      </div>
      <div class="boot-hint hidden" id="boot-hint">
        Бесплатный сервер засыпает без активности — первый запуск может занять до минуты.
      </div>
    </div>
  </div>

  <div id="app">
    <!-- Гейт: вход/регистрация. Без валидной сессии не видно ничего другого. -->
    <div id="page-auth" class="hidden">
      <div class="auth-card">
        <div class="auth-title">Cars DB</div>

        <form id="auth-login-form" class="auth-form">
          <h2 class="auth-h">Вход</h2>
          <label class="edit-field"><span>Логин</span>
            <input id="auth-login-login" type="text" autocomplete="username" required/>
          </label>
          <label class="edit-field"><span>Пароль</span>
            <input id="auth-login-password" type="password" autocomplete="current-password" required/>
          </label>
          <div id="auth-login-error" class="edit-error hidden"></div>
          <button type="submit" class="btn btn-pri auth-submit" id="auth-login-submit">Войти</button>
          <button type="button" class="btn btn-sec auth-switch" id="auth-show-register">Нет аккаунта? Регистрация</button>
        </form>

        <form id="auth-register-form" class="auth-form hidden">
          <h2 class="auth-h">Заявка на регистрацию</h2>
          <label class="edit-field"><span>Отображаемое имя</span>
            <input id="auth-reg-name" type="text" required/>
          </label>
          <label class="edit-field"><span>Логин для входа</span>
            <input id="auth-reg-login" type="text" autocomplete="username" required/>
          </label>
          <label class="edit-field"><span>Пароль</span>
            <input id="auth-reg-password" type="password" autocomplete="new-password" required/>
          </label>
          <div id="auth-reg-error" class="edit-error hidden"></div>
          <div id="auth-reg-success" class="auth-success hidden"></div>
          <button type="submit" class="btn btn-pri auth-submit" id="auth-reg-submit">Отправить заявку</button>
          <button type="button" class="btn btn-sec auth-switch" id="auth-show-login">Назад ко входу</button>
        </form>
      </div>
    </div>

    <!-- Search page -->
    <div id="page-search" class="hidden">
      <div class="sphere-glow"></div>
      <canvas id="sphere-canvas"></canvas>
      <div class="top-bar-user">
        <button id="btn-avatar" class="avatar-circle" title="Профиль">
          <span class="avatar-default-icon"></span>
          <img id="avatar-img" alt="" hidden/>
        </button>
        <button id="btn-top" class="btn btn-sec btn-top">Топ</button>
      </div>
      <div class="search-ui">
        <p class="search-kicker">Car Search</p>
        <div class="search-wrap">
          <div class="search-mode-toggle" id="search-mode-toggle">
            <button type="button" class="chip active" id="mode-btn-search">Поиск</button>
            <button type="button" class="chip" id="mode-btn-tags">Теги</button>
          </div>
          <div class="search-box">
            <input id="search-input" type="search" placeholder="Wake up, neo. . ." autocomplete="off" spellcheck="false"/>
          </div>
          <div id="search-results" class="search-results"></div>

          <div id="tag-search" class="tag-search hidden">
            <div class="tag-select-row">
              <div class="tag-combo" id="tag-combo-brand">
                <input type="text" class="tag-combo-input" placeholder="Марка…" autocomplete="off" spellcheck="false"/>
                <button type="button" class="tag-combo-clear hidden" aria-label="Очистить">✕</button>
                <div class="tag-combo-list hidden"></div>
              </div>
              <div class="tag-combo hidden" id="tag-combo-model">
                <input type="text" class="tag-combo-input" placeholder="Модель…" autocomplete="off" spellcheck="false"/>
                <button type="button" class="tag-combo-clear hidden" aria-label="Очистить">✕</button>
                <div class="tag-combo-list hidden"></div>
              </div>
              <div class="tag-combo hidden" id="tag-combo-volume">
                <input type="text" class="tag-combo-input" placeholder="Объём…" autocomplete="off" spellcheck="false"/>
                <button type="button" class="tag-combo-clear hidden" aria-label="Очистить">✕</button>
                <div class="tag-combo-list hidden"></div>
              </div>
            </div>
            <div id="tag-results" class="search-results tag-results"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Car page (hidden until car selected) -->
    <div id="page-calc" class="hidden">
      <div class="calc-topbar">
        <button id="btn-back" class="btn btn-sec">← К поиску</button>
        <div id="calc-car-title" class="calc-car-title"></div>
      </div>
      <div id="car-head"></div>
      <div id="crm-panel"></div>
      <div class="calc-layout">
        <div class="calc-main" id="calc-main"></div>
        <div class="report-panel">
          <div class="report-head">
            <span>Итог для Битрикса</span>
            <button class="btn btn-sec" id="btn-copy">⧉ Копировать</button>
          </div>
          <pre id="report-output" class="report-output">— выберите агрегаты —</pre>
        </div>
      </div>
      <div id="car-events" class="car-events"></div>
    </div>

    <!-- Профиль -->
    <div id="page-profile" class="hidden">
      <div class="calc-topbar">
        <button id="btn-profile-back" class="btn btn-sec">← К поиску</button>
        <div class="calc-car-title" id="page-profile-title">Профиль</div>
      </div>
      <div id="profile-content" class="profile-content"></div>
    </div>
  </div>

  <!-- Модалка «Топ» -->
  <div id="top-modal" class="modal hidden">
    <div class="modal-backdrop" id="top-modal-backdrop"></div>
    <div class="modal-win">
      <div class="modal-head">
        <span>Топ по машинам и записям</span>
        <button class="btn btn-sec" id="top-modal-close">✕</button>
      </div>
      <div id="top-modal-body" class="modal-body"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
