# nginx на своём сервере: отдаёт собранный сайт и проксирует API на бэкенд.
#
# Главное здесь — сайт и API на ОДНОМ домене (k-spot.ru и k-spot.ru/api вместо
# отдельного api.k-spot.ru). Запросы перестают быть межоригинными, а значит
# браузер больше не шлёт preflight OPTIONS перед каждым обращением: раньше их
# было столько же, сколько самих запросов (заголовки x-api-key и Authorization
# нестандартные, а preflight кэшируется недолго). Половина сетевого разговора
# исчезает просто от того, что домен один.
#
# TLS-секции здесь нет намеренно: их допишет certbot --nginx при первом выпуске
# сертификата (см. DEPLOY-VPS.md, шаг 6) — так его же и автопродление потом
# ничего не сломает.

upstream backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name k-spot.ru www.k-spot.ru;

    root /var/www/k-spot;
    index index.html;

    # Сжатие: раньше его делал Cloudflare, теперь наше дело. Снимок базы машин
    # (~13к записей) без gzip весит мегабайты, с ним — сотни килобайт.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/manifest+json
        image/svg+xml;

    client_max_body_size 8m;   # аватарка до 5 МБ + запас на multipart

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';           # keep-alive до upstream
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Живая доска ходит в оригинальную админку и отвечает не мгновенно.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location = /health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        access_log off;
    }

    # ── Аватарки ─────────────────────────────────────────────────────────────
    # Отдаёт Node с локального диска. Кэш-заголовки не переопределяем: путь
    # детерминированный, при смене фото URL тот же, нужна ревалидация по ETag.
    location /avatars/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
    }

    # ── Сайт ─────────────────────────────────────────────────────────────────
    # Файлы сборки Vite содержат хэш в имени (main-DHH5Yr1M.js) — их можно
    # кэшировать намертво: меняется содержимое, меняется и имя.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Остальное — SPA: любой путь отдаёт index.html, роутинг разбирает фронт.
    # Сам index.html кэшировать нельзя, иначе после деплоя браузер продолжит
    # просить старые assets.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
