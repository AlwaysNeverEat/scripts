services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: carsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/carsdb
      API_KEY: local-dev-key
      CORS_ORIGINS: 'http://localhost:5173,http://localhost:4173'
      PORT: 3001
      # Пусто = бот и загрузка аватарок выключены локально; заполнить своими
      # значениями, если нужно проверить Telegram-заявки/Storage в докере.
      TELEGRAM_BOT_TOKEN: ''
      ADMIN_TELEGRAM_ID: '691442300'
      SUPABASE_URL: ''
      SUPABASE_SERVICE_KEY: ''
      # Учётка CRM для панели «Наличие на станции»; пусто = панель сообщит,
      # что CRM не настроена. Задать через .env или окружение хоста.
      CRM_LOGIN: '${CRM_LOGIN:-}'
      CRM_PASSWORD: '${CRM_PASSWORD:-}'
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE: ''        # empty = use Vite proxy (dev) or relative path (prod)
      VITE_API_KEY: local-dev-key
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  pg_data:
