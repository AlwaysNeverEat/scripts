<!DOCTYPE html>
<!-- Композитор демо-ролика K-Spot под «Тыдыщ!» (Фиксики).
     Кадр — чистая функция от времени: window.renderAt(t) расставляет всё на
     сцене и ждёт, пока картинки клипов раскодируются. render.cjs зовёт её
     кадр за кадром и снимает скриншоты, поэтому ролик детерминирован и не
     зависит от скорости машины. Как собрать — README.md рядом. -->
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<title>K-Spot — Тыдыщ</title>
<link href="fonts/fonts.css" rel="stylesheet"/>
<style>
  :root {
    --acc: #f5b50a;
    --acc-2: #ffd24d;
    --bg: #04060a;

  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);

  .layer { position: absolute; inset: 0; }

  /* ── фон ───────────────────────────────────────────── */

          var(--bg); }
  #grid { opacity: .5;
          background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
          background-size: 64px 64px; }

  /* ── старая CRM ────────────────────────────────────── */
  #crm { font-family: Tahoma, Verdana, "DejaVu Sans", sans-serif; }
  .xp { position: absolute; left: 240px; top: 64px; width: 1440px; height: 800px; background: #ece9d8;

        transform-origin: 50% 50%; overflow: hidden; }
  .xp-title { height: 34px; background: linear-gradient(#0a5fe8, #0443c4 45%, #0a3bb0); color: #fff;
              font: bold 15px Tahoma, "DejaVu Sans", sans-serif; display: flex; align-items: center; padding: 0 10px;
              gap: 8px; text-shadow: 1px 1px #0b2a7a; border-radius: 7px 7px 0 0; }
  .xp-title .ie { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #8fd0ff, #1463d6); }
  .xp-title .sp { flex: 1; }

  .dlg { position: absolute; width: 440px; background: #ece9d8; border: 1px solid #0831d9; border-radius: 7px 7px 0 0;

  .dlg .t { height: 30px; border-radius: 6px 6px 0 0; background: linear-gradient(#0a5fe8, #0443c4 45%, #0a3bb0); color: #fff;

  .dlg .b { display: flex; gap: 14px; padding: 16px 16px 8px; font-size: 15px; color: #000; align-items: center; }
  .dlg .ic { flex: none; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8a7a, #c8120a);

  /* наклейка с болью */

  /* ── титры-подпевка ────────────────────────────────── */

  #lyric .rep b { position: absolute; left: 50%; bottom: 78%; transform: translateX(-50%) rotate(-5deg) scale(var(--pop, 1));
                  font: 900 40px Unbounded, sans-serif; color: var(--acc); white-space: nowrap; text-shadow: 0 3px 12px rgba(0,0,0,.9); }

  /* ── отсчёт ────────────────────────────────────────── */

  .win .dot { width: 12px; height: 12px; border-radius: 50%; }

  .logo { font: 900 200px/1 Unbounded, sans-serif; letter-spacing: -.04em; text-align: center;
          text-shadow: 0 20px 80px rgba(0,0,0,.8); }

  .tag em { font-style: normal; color: var(--acc); }
  .site { margin-top: 26px; text-align: center; font: 700 30px "JetBrains Mono", monospace; color: #c9d1dc; letter-spacing: .04em; }

  #stampL { display: grid; place-items: center; pointer-events: none; }
  #burst { position: absolute; left: 50%; top: 50%; width: 1700px; height: 1700px; margin: -850px 0 0 -850px; }
  #stamp { position: relative; font: 900 250px/1 Unbounded, sans-serif; letter-spacing: -.04em; color: var(--acc);

  #vign { pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }

  #crmCur { position: absolute; left: 0; top: 0; width: 34px; height: 34px; z-index: 5; filter: drop-shadow(0 3px 5px rgba(0,0,0,.5)); }
  #crmCur svg { width: 34px; height: 34px; display: block; }
  .crm-rip { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
             border: 4px solid rgba(255,200,40,.95); z-index: 4; }
  #flood { position: absolute; border-radius: 50%; z-index: 6; }
  #morph { position: absolute; z-index: 3; }
  .mask { overflow: hidden; padding-bottom: .14em; margin-bottom: -.14em; }
  .mask > .in { display: block; will-change: transform; }
  #intro { display: grid; place-items: center; font: 700 44px "JetBrains Mono", monospace; color: #9aa4b2; }
  #intro .cur { display: inline-block; width: .6em; height: 1em; background: var(--acc); vertical-align: -.12em; margin-left: .1em; }
</style>
</head>
<body>
<div id="stage">

    <!-- полноэкранная сфера под логотипом -->
    <div id="fullL" class="layer full hide"><img id="fullImg" alt=""/></div>
    <div id="fullShade" class="layer hide" style="background: radial-gradient(ellipse at center, rgba(4,6,10,.35), rgba(4,6,10,.85))"></div>

    <!-- демо сайта -->

      <div class="brand"><span class="k">K</span>SPOT</div>
      <div id="head"><div class="k mask"><div class="in" id="hk"></div></div><div class="h mask"><div class="in" id="hh"></div></div><div class="s mask"><div class="in" id="hs"></div></div><div class="was mask"><div class="in" id="hw"></div></div></div>
      <div class="win" id="win">

          <div class="url"><span class="lock">●</span><span id="url">k-spot.ru</span></div></div>

<script>
// ═══ Время трека ════════════════════════════════════════════════════════
// Замерено по самому треку (README.md): темп 114, «Тыдыщ!» — ровно через такт.
const BEAT = 60 / 114, BAR = 4 * BEAT;
const HIT0 = 22.68;
const HIT = k => HIT0 + k * BAR;               // 22.68, 24.79 … 37.42
const BEAT0 = HIT0 - 43 * BEAT;                // сетка долей
const LINES = [3.49, 5.61, 7.95, 10.08, 12.18, 14.29, 16.13, 18.49]; // строки куплета
const COUNT = [20.58, 21.63, 22.16];           // «Раз, два, три»
const END = 40.6;

// ═══ Мелочи ═════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const eo3 = k => 1 - Math.pow(1 - k, 3);
const eo5 = k => 1 - Math.pow(1 - k, 5);
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const back = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
// Пружина — замкнутая форма отклика на ступеньку: чистая функция времени,
// без состояния между кадрами. d — секунды от толчка.
function spring(d, f = 3.2, z = .42) {
  if (d <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * d) * (Math.cos(wd * d) + (z * w / wd) * Math.sin(wd * d));
}
// Текст, встающий из-под линии маски: in — выезд снизу, out — уход вниз.
function rise(el, d, dOut = -1) {
  const k = spring(d, 2.6, .8);
  const o = dOut > 0 ? eio(clamp(dOut / .22)) : 0;
  el.style.transform = `translateY(${(1 - k) * 110 + o * 110}%)`;
}
function rnd(seed) { let s = seed * 9301 + 49297; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
const show = (el, on) => el.classList.toggle('hide', !on);
function setHTML(el, html) { if (el.__h !== html) { el.innerHTML = html; el.__h = html; } }
function setText(el, s) { if (el.__t !== s) { el.textContent = s; el.__t = s; } }
// Кусочно-линейная кривая по ключам [[x, y], …]
function curve(keys, x) {
  if (x <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (x <= keys[i][0]) {
    const [x0, y0] = keys[i - 1], [x1, y1] = keys[i];
    return lerp(y0, y1, (x - x0) / (x1 - x0));
  }
  return keys[keys.length - 1][1];
}
// Камера: ключи {t, z, x, y} со сглаживанием между ними
function camAt(keys, x) {
  if (x <= keys[0].t) return keys[0];
  for (let i = 1; i < keys.length; i++) if (x <= keys[i].t) {
    const a = keys[i - 1], b = keys[i], k = eio((x - a.t) / (b.t - a.t));
    return { z: lerp(a.z, b.z, k), x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k) };
  }
  return keys[keys.length - 1];
}

// ═══ Клипы ══════════════════════════════════════════════════════════════
const CLIPS_BASE = new URLSearchParams(location.search).get('clips') || 'clips/';
const CLIPS = {};
async function loadClips(names) {
  await Promise.all(names.map(async n => {
    const j = await (await fetch(CLIPS_BASE + n + '/clip.json')).json();
    CLIPS[n] = j;
  }));
}
function frameAt(name, ct) {
  const fr = CLIPS[name].frames;
  let lo = 0, hi = fr.length - 1;
  if (ct <= fr[0].t) return CLIPS_BASE + name + '/' + fr[0].f;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (fr[m].t <= ct) lo = m; else hi = m - 1; }
  return CLIPS_BASE + name + '/' + fr[lo].f;
}
const pending = [];
function setImg(img, src) {
  if (img.__src === src) return;
  img.__src = src;
  img.src = src;
  pending.push(img.decode().catch(() => {}));
}

// ═══ Сцены припева ══════════════════════════════════════════════════════
// Для каждой: какой клип, как время ролика ложится на время клипа (map:
// [сек от начала сцены, сек клипа]), куда смотрит камера (в CSS-пикселях
// клипа 1600×900) и что написано слева.
const SCENES = [
  { from: HIT(1), clip: 'client', url: 'k-spot.ru/client', n: '01 · Клиент',
    h: 'Клиент', s: 'Телефон — и <b>вся история</b>. Чеки подтягиваются сами.', was: 'было: <s>4 страницы и чек по ссылке</s>',
    map: [[0, 1.45], [0.32, 2.25], [2.1, 7.2]],
    cam: [{ t: 0, z: 1.75, x: 800, y: 160 }, { t: .6, z: 1.6, x: 800, y: 260 }, { t: 2.1, z: 1.5, x: 800, y: 345 }] },
  { from: HIT(2), clip: 'records', url: 'k-spot.ru/records', n: '02 · Запись',
    h: 'Запись', s: '<b>Одна кнопка:</b> записать и скопировать для Битрикса. Окно не ждёт CRM.', was: 'было: <s>2,5 часа → 3 слота вместо 5</s>',

  const jit = wait ? Math.sin(t * 40) * 2 : 0;
  // Кончик стрелки — в точке (x, y).
  cur.style.transform = `translate(${x - 5 + jit}px,${y - 3}px) rotate(${wait ? (t * 360) % 360 : 0}deg)`;
  let html = '';
  for (const w of path) {
    if (!w.click || !w.p) continue;
    const d = lt - w.at;
    if (d < 0 || d > .45) continue;
    const k = eo3(d / .45);
    html += `<div class="crm-rip" style="left:${w.p.x}px;top:${w.p.y}px;transform:scale(${.3 + k * 1.2});opacity:${1 - k}"></div>`;
  }
  rips.innerHTML = html;
  renderFlood(t);
}
// Крестик окна, нажатый в конце куплета, разливается на весь кадр: CRM закрыта.
function renderFlood(t) {
  const f = $('flood');
  const d = t - FLOOD_AT;
  show(f, d >= 0);
  if (d < 0) return;
  const p = posOf('.xp-title .xp-btn.x', 0) || { x: 1660, y: 80 };
  // Радиус с запасом за углы кадра: иначе в последнем кадре заливки угол мигнёт.
  const R = 2400 * eio(clamp(d / .32)) + 14;
  f.style.left = (p.x - R) + 'px'; f.style.top = (p.y - R) + 'px';
  f.style.width = f.style.height = (2 * R) + 'px';
  const c = clamp(d / .32);
  f.style.background = `rgb(${Math.round(lerp(194, 0, c))},${Math.round(lerp(64, 0, c))},${Math.round(lerp(31, 0, c))})`;
}

// ═══ Вступление ═════════════════════════════════════════════════════════
function renderIntro(t) {
  const on = t < 2.45;
  show($('intro'), on);
  const m = $('morph');
  show(m, t >= 1.95 && t < 2.45);
  if (!on) return;
  const msg = '09:00. Открываем CRM';
  const n = Math.floor(clamp((t - .35) / 1.1) * msg.length);
  setText($('introTxt'), msg.slice(0, n) + (t > 1.6 ? '…' : ''));
  $('introCur').style.opacity = t >= 1.95 ? '0' : caretBlink(t);
  // Строка уходит вниз под маску, курсор остаётся и растёт в окно CRM.
  rise($('introIn'), 1, t - 1.95);
  if (t >= 1.95) {
    const c = CARET, k = eio(clamp((t - 1.95) / .5));
    const x = lerp(c.x, 240, k), y = lerp(c.y, 64, k), w = lerp(c.w, 1440, k), h = lerp(c.h, 800, k);
    Object.assign(m.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px',
      borderRadius: lerp(2, 8, k) + 'px',
      background: `rgb(${Math.round(lerp(245, 236, k))},${Math.round(lerp(181, 233, k))},${Math.round(lerp(10, 216, k))})` });
  }
}
// Мигание курсора — одно на начало и конец ролика: последний кадр = первый.
const caretBlink = t => (Math.floor(t * 3.8) % 2) ? '0' : '1';
// Где стоит курсор полной строки «09:00. Открываем CRM…» (замеряется один раз).
let CARET = { x: 1236, y: 518, w: 26, h: 44 };
function measureCaret() {
  const tx = $('introTxt'), c = $('introCur');
  const old = tx.textContent;
  tx.textContent = '09:00. Открываем CRM…';
  const r = c.getBoundingClientRect(), s = $('stage').getBoundingClientRect();
  CARET = { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height };
  // И где он в первом кадре, при пустой строке: туда же вернётся финал.
  tx.textContent = '';
  const r0 = c.getBoundingClientRect();
  CARET0 = { x: r0.left - s.left, y: r0.top - s.top, w: r0.width, h: r0.height };
  tx.textContent = old; tx.__t = null;
}
let CARET0 = { x: 947, y: 518, w: 26, h: 44 };

// ═══ Отсчёт «Раз, два, три» ═════════════════════════════════════════════
function renderCount(t) {
  const on = t >= 20.45 && t < HIT0;
  show($('count'), on);
  if (!on) return;
  let i = -1;
  for (let j = 0; j < 3; j++) if (t >= COUNT[j] - .02) i = j;
  const n = $('countN');
  if (i < 0) { setText(n, ''); return; }
  setText(n, ['РАЗ', 'ДВА', 'ТРИ'][i]);
  const d = t - COUNT[i];
  const s = lerp(1.9, 1, eo5(clamp(d / .14)));
  n.style.transform = `scale(${s}) rotate(${[-4, 3, -2][i]}deg)`;
  n.style.color = i === 2 ? '#fff' : 'var(--acc)';
}

// ═══ Удар ═══════════════════════════════════════════════════════════════
let lastHit = -1;
function hitInfo(t) {
  // Какой удар был последним и сколько прошло. H3 — «Раз» без «Тыдыщ!».
  let k = -1;
  for (let j = 0; j < 8; j++) if (t >= HIT(j)) k = j;
  return k < 0 ? null : { k, d: t - HIT(k) };
}
function burstSvg(k) {
  const r = rnd(k + 40);
  let d = '';
  const n = 26;
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * Math.PI * 2, a1 = ((i + .5) / n) * Math.PI * 2, a2 = ((i + 1) / n) * Math.PI * 2;
    const R = 70 + r() * 30, r0 = 26;
    d += `M${Math.cos(a0) * r0} ${Math.sin(a0) * r0} L${Math.cos(a1) * R} ${Math.sin(a1) * R} L${Math.cos(a2) * r0} ${Math.sin(a2) * r0} Z `;
  }
  return `<path d="${d}" fill="#f5b50a" opacity=".95"/><circle r="32" fill="#f5b50a"/>`;
}
function renderHit(t) {
  const h = hitInfo(t);
  const stampOn = h && h.k !== 3 && h.d < .5;
  show($('stampL'), !!stampOn);
  $('flash').style.opacity = h && h.d < .16 ? String((1 - h.d / .16) * (h.k === 3 ? .35 : .9)) : '0';
  if (stampOn) {
    if (lastHit !== h.k) { $('burst').innerHTML = burstSvg(h.k); lastHit = h.k; }
    const d = h.d;
    const s = lerp(2.2, 1, eo5(clamp(d / .1))) * (1 + d * .12);
    // Уходит не в прозрачность, а в точку — сжатием.
    const gone = 1 - eio(inv(.34, .5, d));
    const r = rnd(h.k + 1);
    $('stamp').style.transform = `rotate(${(r() - .5) * 12}deg) scale(${s * gone})`;
    $('burst').style.transform = `scale(${lerp(.3, 1.15, eo5(clamp(d / .2))) * gone}) rotate(${d * 40 + h.k * 17}deg)`;
  }
}
function camShake(t) {
  const h = hitInfo(t);
  let x = 0, y = 0, r = 0, s = 1;
  if (h && h.d < .6) {
    const a = (h.k === 3 ? 10 : 34) * Math.exp(-h.d * 9);
    x = a * Math.sin(h.d * 83 + h.k); y = a * Math.cos(h.d * 71 + h.k * 2); r = a * .03 * Math.sin(h.d * 47);
    s = 1 + .05 * Math.exp(-h.d * 10);
  }
  // Пульс по долям в припеве.
  if (t >= HIT0 && t < HIT(7)) {
    const ph = ((t - BEAT0) % BEAT + BEAT) % BEAT;
    s *= 1 + .01 * Math.exp(-ph * 12);
  }
  // Толчки на «Раз, два, три».
  for (const c of COUNT) if (t >= c && t < c + .4) { const d = t - c; const a = 16 * Math.exp(-d * 11); x += a * Math.sin(d * 90); y += a * Math.cos(d * 77); }
  $('cam').style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;
}

// ═══ Логотип (первый удар и финал) ══════════════════════════════════════
function renderLogo(t) {
  const first = t >= HIT(0) && t < HIT(1) + .3;
  const fin = t >= HIT(7);
  const on = first || fin;
  show($('logoL'), on); show($('fullL'), on); show($('fullShade'), on);
  if (!on) return;
  const h0 = first ? HIT(0) : HIT(7);
  const d = t - h0;
  // Сфера из машин с главной — живая, из клипа.
  setImg($('fullImg'), frameAt('sphere', (first ? 0.4 : 1.6) + d * .9));
  $('fullImg').style.transform = `scale(${1.25 + d * .03})`;
  $('fullImg').style.filter = fin ? 'blur(5px) brightness(1.4)' : 'blur(1.5px) brightness(1.3)';
  const lg = $('logo');
  const s = 1 + (1 - spring(d, 3.0, .5)) * .6;
  lg.style.transform = `scale(${s})`;
  setHTML($('tag'), first ? 'Та же CRM. <em>Только работает.</em>' : 'Починили. <em>Тыдыщ!</em>');
  // Финал сворачивается в курсор первого кадра — ролик можно крутить по кругу.
  const OUT = HIT(7) + 1.55, SQ = OUT + .5;
  rise($('tag'), d - (first ? .5 : .55), fin ? t - OUT : -1);
  rise($('site'), fin ? d - 1.05 : -1, fin ? t - OUT : -1);
  const sq = fin ? eio(clamp((t - SQ) / .55)) : 0;
  // «SPOT» въезжает в K, как гармошка, и K сжимается в курсор.
  $('logoSpot').style.display = 'inline-block';
  $('logoSpot').style.transformOrigin = '0 50%';
  $('logoSpot').style.transform = `scaleX(${1 - eio(clamp((t - OUT) / .4)) * (fin ? 1 : 0)})`;
  $('logoSpot').style.visibility = fin && t >= OUT + .4 ? 'hidden' : 'inherit';
  const K = $('logoK');
  K.style.display = 'inline-block';
  if (fin && t >= OUT + .4) {
    // Переносим K ровно на место курсора: считаем от его нынешней рамки.
    K.style.transform = '';
    const r = K.getBoundingClientRect(), st = $('stage').getBoundingClientRect();
    const cx = r.left - st.left + r.width / 2, cy = r.top - st.top + r.height / 2;
    const C = CARET0;
    const tx = C.x + C.w / 2 - cx, ty = C.y + C.h / 2 - cy;
    K.style.transformOrigin = '50% 50%';
    K.style.transform = `translate(${tx * sq}px,${ty * sq}px) scale(${lerp(1, C.w / r.width, sq)},${lerp(1, C.h / r.height, sq)})`;
    K.style.color = sq > .35 ? 'transparent' : '#000';
    // Тень букв логотипа отбрасывает и прозрачная «K» — у курсора её быть не должно.
    K.style.textShadow = sq > .35 ? 'none' : '';
    K.style.borderRadius = lerp(10, 2 / (C.w / r.width), sq) + 'px';
    if (sq >= 1) K.style.opacity = caretBlink(t);
  } else { K.style.transform = ''; K.style.color = '#000'; K.style.opacity = '1'; }
  // Сфера под логотипом стягивается кругом в K, а не гаснет.
  const shrink = fin ? eio(clamp((t - OUT) / .5)) : 0;
  const clip = shrink > 0 ? `circle(${lerp(1300, 0, shrink)}px at 50% 50%)` : 'none';
  $('fullL').style.clipPath = clip; $('fullShade').style.clipPath = clip;
  $('logoL').style.opacity = '1';
  if (first) {
    // Первый удар: к следующему такту сфера с логотипом уезжают вверх
    // страницей, а снизу приходит окно сайта (сцена 01).
    const push = eio(clamp((t - HIT(1)) / .3));
    $('logoL').style.transform = $('fullL').style.transform = $('fullShade').style.transform = `translateY(${-push * 1080}px)`;
  } else { $('logoL').style.transform = $('fullL').style.transform = $('fullShade').style.transform = ''; }
}

// ═══ Демо сайта ═════════════════════════════════════════════════════════
// Клип снят 1600×900 CSS-пикселей (×1.5), окно — 1320×743.
function placeClip(img, sc, lt, dy) {
  setImg(img, frameAt(sc.clip, curve(sc.map, lt)));
  const VPW = 1320, VPH = 743, CW = 1600, CH = 900;
  const c = camAt(sc.cam, lt);
  const z = VPW / CW * c.z;
  let ox = VPW / 2 - c.x * z, oy = VPH / 2 - c.y * z;
  ox = clamp(ox, VPW - CW * z, 0); oy = clamp(oy, VPH - CH * z, 0);
  img.style.width = (CW * z) + 'px'; img.style.height = (CH * z) + 'px';
  img.style.transform = `translate(${ox}px,${oy + dy}px)`;
}
function renderDemo(t) {
  const idx = SCENES.findIndex(s => t >= s.from && t < s.to);
  const sc = SCENES[idx];
  show($('demo'), !!sc);
  if (!sc) return;
  const lt = t - sc.from;
  // Смена сцены — страница выталкивает страницу вверх, за 0.3 с.
  const push = idx > 0 ? eio(clamp(lt / .3)) : 1;
  placeClip($('clipImg'), sc, lt, (1 - push) * 743);
  const pimg = $('prevImg');
  if (push < 1) {
    const pv = SCENES[idx - 1];
    pimg.style.display = '';
    placeClip(pimg, pv, pv.to - pv.from, -push * 743);
  } else pimg.style.display = 'none';
  setText($('url'), sc.url);
  // Первая сцена приезжает снизу вместе с кадром, выталкивая логотип.
  $('demo').style.transform = idx === 0 ? `translateY(${(1 - eio(clamp(lt / .3))) * 1080}px)` : '';

  // Окно влетает на смене сцены.
  const k = eo5(clamp(lt / .32));
  const win = $('win');
  const isFirst = SCENES[0] === sc;
  const ry = lerp(isFirst ? -24 : -9, -4, k), sx = lerp(1.1, 1, k);
  win.style.transform = `rotateY(${ry + Math.sin(t * .8) * 1.2}deg) rotateX(${2 + Math.cos(t * .7) * .8}deg) scale(${sx})`;

  // Заголовок слева: слова по долям.
  const same = SCENES.indexOf(sc) > 0 && SCENES[SCENES.indexOf(sc) - 1].n === sc.n;
  setText($('hk'), sc.n); setText($('hh'), sc.h);
  setHTML($('hs'), sc.s); setHTML($('hw'), sc.was);
  // Каждая строка встаёт из-под своей линии маски, по долям.
  const out = sc.to - t;
  rise($('hk'), same ? 1 : lt, same || SCENES[SCENES.indexOf(sc) + 1]?.n === sc.n ? -1 : .22 - out);
  rise($('hh'), lt - .08, .22 - out);
  rise($('hs'), lt - .2, .22 - out);
  rise($('hw'), lt - .45, .22 - out);
}

// ═══ Кадр ═══════════════════════════════════════════════════════════════
window.renderAt = async function (t) {
  renderIntro(t);
  renderCrm(t);
  renderCount(t);
  renderLogo(t);
  renderDemo(t);
  renderHit(t);
  renderLyric(t);
  camShake(t);
  $('grid').style.transform = `translateY(${(t * 12) % 64}px)`;
  const wait = pending.splice(0);
  await Promise.all(wait);
  await document.fonts.ready;
};
window.DURATION = END;
window.ready = (async () => {
  await loadClips(['client', 'records', 'activity', 'stock', 'carpage', 'games', 'doom', 'sphere']);
  // Шрифты грузятся только когда нужны — а нужны они с первого кадра.
  await Promise.all(['500 20px Unbounded', '700 20px Unbounded', '800 20px Unbounded', '900 20px Unbounded',
    '400 20px Inter', '500 20px Inter', '600 20px Inter', '700 20px Inter', '500 20px "JetBrains Mono"', '700 20px "JetBrains Mono"']
    .flatMap(f => [document.fonts.load(f, 'ЖЫabc'), document.fonts.load(f, 'abc')]));
  await document.fonts.ready;
  measureCaret();
})();

// Просмотр в браузере: ?play — крутит ролик в реальном времени с музыкой.
if (new URLSearchParams(location.search).has('play')) {
  window.ready.then(() => {
    const a = new Audio(new URLSearchParams(location.search).get('audio') || 'track.mp3');
    document.body.addEventListener('click', () => {
      a.currentTime = 0; a.play();
      const tick = () => { window.renderAt(a.currentTime); if (a.currentTime < END) requestAnimationFrame(tick); else a.pause(); };
      tick();
    }, { once: true });
    window.renderAt(0);
  });
}
</script>
